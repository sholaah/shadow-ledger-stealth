<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Ledger — a top-down stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a12; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 150vh); height: min(100vh, 66.666vw); display: block; touch-action: none; background: #1c1a24; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Shadow Ledger: sneak through the Meridian Archive, recover 3 ledger pages and reach the exit unseen"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
